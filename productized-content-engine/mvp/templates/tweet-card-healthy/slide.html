<!DOCTYPE html>
<html lang="te">
<head>
  <meta charset="UTF-8" />
  <title>Healthy food tweet card — Telugu</title>
  <style>
    @font-face {
      font-family: "Noto Sans Telugu";
      src: url("file:///usr/share/fonts/truetype/noto/NotoSansTelugu-Regular.ttf") format("truetype");
      font-weight: 400;
      font-style: normal;
    }
    @font-face {
      font-family: "Noto Sans Telugu";
      src: url("file:///usr/share/fonts/truetype/noto/NotoSansTelugu-SemiBold.ttf") format("truetype");
      font-weight: 600;
      font-style: normal;
    }
    @font-face {
      font-family: "Noto Sans Telugu";
      src: url("file:///usr/share/fonts/truetype/noto/NotoSansTelugu-Bold.ttf") format("truetype");
      font-weight: 700;
      font-style: normal;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 1080px;
      height: 1080px;
      overflow: hidden;
      font-family: "Noto Sans Telugu", "Noto Sans", sans-serif;
      background: #f4efe6;
      color: #3d2b1f;
    }
    .frame {
      width: 1080px;
      height: 1080px;
      padding: 64px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      background:
        radial-gradient(ellipse at 20% 10%, rgba(107, 142, 90, 0.12), transparent 45%),
        radial-gradient(ellipse at 90% 80%, rgba(196, 122, 58, 0.10), transparent 40%),
        #f4efe6;
    }
    .card {
      background: #fffaf3;
      border: 2px solid #d9c4a8;
      border-radius: 32px;
      padding: 44px 48px 52px;
      min-height: 560px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 18px 40px rgba(61, 43, 31, 0.08);
    }
    .header {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-bottom: 28px;
    }
    .avatar {
      width: 88px;
      height: 88px;
      border-radius: 50%;
      background: #e8dfd2;
      background-size: cover;
      background-position: center;
      border: 2px solid #c47a3a;
      flex-shrink: 0;
    }
    .name {
      font-size: 30px;
      font-weight: 700;
      color: #3d2b1f;
      line-height: 1.3;
    }
    .sub {
      font-size: 22px;
      color: #6b8e5a;
      margin-top: 6px;
      font-weight: 600;
      line-height: 1.35;
    }
    .body {
      font-size: 40px;
      line-height: 1.45;
      font-weight: 600;
      flex: 1;
      white-space: pre-wrap;
      color: #3d2b1f;
    }
    .footer {
      margin-top: 32px;
      display: flex;
      justify-content: flex-end;
    }
    .cta {
      font-size: 22px;
      color: #5a7349;
      border: 1.5px solid #6b8e5a;
      border-radius: 999px;
      padding: 12px 24px;
      background: rgba(107, 142, 90, 0.08);
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="frame" id="frame">
    <div class="card" id="card">
      <div class="header">
        <div class="avatar" id="avatar"></div>
        <div>
          <div class="name" id="displayName">అమ్మ చేతి రుచులు</div>
          <div class="sub" id="subline">ఆరోగ్యకరమైన ఇంటి అలవాట్లు</div>
        </div>
      </div>
      <div class="body" id="slideText">టెక్స్ట్</div>
      <div class="footer">
        <div class="cta" id="cta">కొనసాగించండి &gt;</div>
      </div>
    </div>
  </div>
  <script>
    window.__setSlide = (payload) => {
      document.getElementById('displayName').textContent = payload.displayName || 'అమ్మ చేతి రుచులు'
      document.getElementById('slideText').textContent = payload.text || ''
      if (payload.subline) document.getElementById('subline').textContent = payload.subline
      if (payload.ctaLabel) document.getElementById('cta').textContent = payload.ctaLabel

      const av = document.getElementById('avatar')
      if (payload.avatarDataUrl) {
        av.style.backgroundImage = `url(${payload.avatarDataUrl})`
        av.style.backgroundSize = 'cover'
        av.style.backgroundPosition = 'center'
      }

      if (payload.bg) document.getElementById('frame').style.background = payload.bg
      if (payload.cardBg) document.getElementById('card').style.background = payload.cardBg
      if (payload.textColor) document.getElementById('slideText').style.color = payload.textColor
      if (payload.nameColor) document.getElementById('displayName').style.color = payload.nameColor
      if (payload.accent) {
        document.getElementById('cta').style.borderColor = payload.accent
        document.getElementById('cta').style.color = payload.accent
        av.style.borderColor = payload.accent
      }
    }
  </script>
</body>
</html>
