<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Tweet card slide</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 1080px;
      height: 1080px;
      overflow: hidden;
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      background: #0a0a0a;
      color: #fff;
    }
    .frame {
      width: 1080px;
      height: 1080px;
      padding: 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .card {
      background: #111;
      border: 1px solid #2a2a2a;
      border-radius: 28px;
      padding: 48px 52px 56px;
      min-height: 520px;
      display: flex;
      flex-direction: column;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-bottom: 36px;
    }
    .avatar {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      object-fit: cover;
      background: #333;
    }
    .name {
      font-size: 28px;
      font-weight: 700;
    }
    .sub {
      font-size: 22px;
      color: #888;
      margin-top: 4px;
    }
    .body {
      font-size: 44px;
      line-height: 1.35;
      font-weight: 600;
      flex: 1;
      white-space: pre-wrap;
    }
    .body strong { font-weight: 800; }
    .footer {
      margin-top: 40px;
      display: flex;
      justify-content: flex-end;
    }
    .cta {
      font-size: 22px;
      color: #aaa;
      border: 1px solid #444;
      border-radius: 999px;
      padding: 10px 22px;
    }
  </style>
</head>
<body>
  <div class="frame">
    <div class="card">
      <div class="header">
        <div class="avatar" id="avatar"></div>
        <div>
          <div class="name" id="displayName">Brand</div>
          <div class="sub">Just now · Instagram</div>
        </div>
      </div>
      <div class="body" id="slideText">Hook text</div>
      <div class="footer">
        <div class="cta">Continue Reading &gt;</div>
      </div>
    </div>
  </div>
  <script>
    // Playwright can set these via page.evaluate before screenshot
    window.__setSlide = (payload) => {
      document.getElementById('displayName').textContent = payload.displayName || 'Brand'
      document.getElementById('slideText').textContent = payload.text || ''
      const av = document.getElementById('avatar')
      if (payload.avatarDataUrl) {
        av.style.backgroundImage = `url(${payload.avatarDataUrl})`
        av.style.backgroundSize = 'cover'
      }
      if (payload.bg) document.body.style.background = payload.bg
    }
  </script>
</body>
</html>
