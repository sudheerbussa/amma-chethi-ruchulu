services:
  # Local Postgres for order-bot (optional — leave DATABASE_URL empty to use JSON)
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: acr
      POSTGRES_PASSWORD: acr_dev
      POSTGRES_DB: acr_orders
    ports:
      - '5432:5432'
    volumes:
      - acr_pg_data:/var/lib/postgresql/data

volumes:
  acr_pg_data:
